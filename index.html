<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولانا سلمان حسینی ندویؒ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    font-family: "Noto Nastaliq Urdu", serif;
    background-color: #05132b;
    color: #fff;
    position: relative;
}

/* پس منظر کا اسکیچ */
body::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 52%;
    height: 100%;
    background:
        linear-gradient(
            to left,
            rgba(5, 19, 43, 0.15),
            rgba(5, 19, 43, 0.55)
        ),
        url('sketch12.jpg');
    background-repeat: no-repeat;
    background-position: center bottom;
    background-size: contain;
    opacity: 0.45;
}

/* بائیں جانب متن */
.container {
    width: 48%;
    padding: 60px;
    position: relative;
    z-index: 1;
    text-align: center;
}

h1 {
    margin: 0;
    font-size: 64px;
    line-height: 1.4;
    color: #d8b06a;
    font-weight: 700;
}

p {
    margin: 0;
    font-size: 30px;
    line-height: 2.1;
    color: #ececec;
}

.domain {
    margin-top: 25px;
    font-size: 24px;
    color: #d8b06a;
    direction: ltr;
    letter-spacing: 4px;
}

/* اورنامنٹ */
.ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 30px 0;
}

.ornament::before,
.ornament::after {
    content: "";
    width: 140px;
    height: 1px;
    background: rgba(216, 176, 106, 0.45);
}

.ornament svg {
    width: 44px;
    height: 22px;
    fill: #d8b06a;
}

/* موبائل */
@media (max-width: 768px) {

    body::before {
        width: 100%;
        opacity: 0.22;
        background-position: right bottom;
        background-size: 75%;
    }

    .container {
        width: 100%;
        padding: 30px;
    }

    h1 {
        font-size: 42px;
    }

    p {
        font-size: 22px;
        line-height: 2;
    }

    .domain {
        font-size: 18px;
        letter-spacing: 2px;
    }

    .ornament::before,
    .ornament::after {
        width: 70px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>مولانا سلمان حسینی ندویؒ</h1>

    <div class="ornament">
        <svg viewBox="0 0 120 60" aria-hidden="true">
            <path d="M60 30
                     C60 12,78 8,86 20
                     C88 10,98 8,104 16
                     C98 24,90 26,82 24
                     C80 34,72 40,60 42
                     C48 40,40 34,38 24
                     C30 26,22 24,16 16
                     C22 8,32 10,34 20
                     C42 8,60 12,60 30Z"/>
            <circle cx="60" cy="30" r="4"/>
        </svg>
    </div>

    <p>
        ویب گاہ زیرِ تعمیر ہے۔<br>
        ان شاء اللہ جلد آپ کی خدمت میں پیش کی جائے گی۔
    </p>

    <div class="ornament">
        <svg viewBox="0 0 120 60" aria-hidden="true">
            <path d="M60 30
                     C60 12,78 8,86 20
                     C88 10,98 8,104 16
                     C98 24,90 26,82 24
                     C80 34,72 40,60 42
                     C48 40,40 34,38 24
                     C30 26,22 24,16 16
                     C22 8,32 10,34 20
                     C42 8,60 12,60 30Z"/>
            <circle cx="60" cy="30" r="4"/>
        </svg>
    </div>

    <div class="domain">
        salmanhusaini.com
    </div>

</div>

</body>
</html>
