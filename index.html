<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولانا سلمان حسینی ندویؒ</title>

<style>
@font-face {
    font-family: "mehr";
    src: url("fonts/MehrNastaliqWeb.woff") format("woff"),
         url("fonts/MehrNastaliqWeb.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    color: #fff;
    font-family: "mehr", "Noto Nastaliq Urdu", serif;
    background-color: #0b1220;
}

.page {
    display: flex;
    min-height: 100vh;
}

.image-side {
    flex: 0 0 42%;
    position: relative;
    background-image: url('sketch12.jpg');
    background-repeat: no-repeat;
    background-position: center bottom;
    background-size: cover;
}

.image-side::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to left,
        rgba(11, 18, 32, 1) 0%,
        rgba(11, 18, 32, 0.05) 18%,
        rgba(11, 18, 32, 0) 40%
    );
}

.content-side {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px 40px;
    background:
        radial-gradient(circle at 30% 20%, rgba(30, 41, 59, 0.6), transparent 60%),
        linear-gradient(160deg, #101a30 0%, #0b1220 60%, #060a14 100%);
}

.container {
    max-width: 640px;
}

h1 {
    margin: 0;
    font-size: 54px;
    line-height: 1.5;
    color: #d4af6a;
    font-weight: 700;
}

.ornament,
.ornament-bottom {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 26px 0;
}

.ornament::before,
.ornament::after,
.ornament-bottom::before,
.ornament-bottom::after {
    content: "";
    width: 130px;
    height: 1px;
    background: rgba(212, 175, 106, 0.45);
}

.ornament svg,
.ornament-bottom svg {
    width: 40px;
    height: 20px;
    fill: #d4af6a;
}

p {
    margin: 0;
    font-size: 26px;
    line-height: 2.2;
    color: #e5e7eb;
}

.domain {
    margin-top: 0;
    font-size: 22px;
    color: #d4af6a;
    direction: ltr;
    letter-spacing: 4px;
}

@media (max-width: 768px) {
    body {
        background:
            radial-gradient(circle at 30% 20%, rgba(30, 41, 59, 0.6), transparent 60%),
            linear-gradient(160deg, #101a30 0%, #0b1220 60%, #060a14 100%);
    }

    .page {
        flex-direction: column;
        align-items: center;
    }

    .image-side {
        flex: 0 0 auto;
        width: 170px;
        height: 170px;
        margin-top: 50px;
        border-radius: 50%;
        background-position: center 15%;
        box-shadow:
            0 0 0 3px rgba(212, 175, 106, 0.55),
            0 12px 30px rgba(0, 0, 0, 0.55);
    }

    .image-side::after {
        display: none;
    }

    .content-side {
        background: transparent;
        padding: 30px 24px 55px;
    }

    h1 {
        font-size: 38px;
    }

    p {
        font-size: 21px;
    }

    .domain {
        font-size: 18px;
    }

    .ornament::before,
    .ornament::after,
    .ornament-bottom::before,
    .ornament-bottom::after {
        width: 70px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="image-side"></div>

    <div class="content-side">
        <div class="container">

            <h1>مولانا سلمان حسینی ندویؒ</h1>

            <div class="ornament">
                <svg viewBox="0 0 120 60" aria-hidden="true">
                    <path d="M60 30
                             C60 12, 78 8, 86 20
                             C88 10, 98 8, 104 16
                             C98 24, 90 26, 82 24
                             C80 34, 72 40, 60 42
                             C48 40, 40 34, 38 24
                             C30 26, 22 24, 16 16
                             C22 8, 32 10, 34 20
                             C42 8, 60 12, 60 30Z"/>
                    <circle cx="60" cy="30" r="4"/>
                </svg>
            </div>

            <p>
                ویب گاہ زیرِ تعمیر ہے۔<br>
                ان شاء اللہ جلد آپ کی خدمت میں پیش کی جائے گی۔
            </p>

            <div class="ornament-bottom">
                <svg viewBox="0 0 120 60" aria-hidden="true">
                    <path d="M60 30
                             C60 12, 78 8, 86 20
                             C88 10, 98 8, 104 16
                             C98 24, 90 26, 82 24
                             C80 34, 72 40, 60 42
                             C48 40, 40 34, 38 24
                             C30 26, 22 24, 16 16
                             C22 8, 32 10, 34 20
                             C42 8, 60 12, 60 30Z"/>
                    <circle cx="60" cy="30" r="4"/>
                </svg>
            </div>

            <div class="domain">
                salmanhusaini.com
            </div>

        </div>
    </div>

</div>

</body>
</html>
